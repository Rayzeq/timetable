# requires both repositories cloned side by side:
#   <parent>/unilim-timetable   (this repository)
#   <parent>/unilim-edt-iut-info
#
# then, from this repository: docker compose up -d --build
# the app is served on http://localhost:8080 - override with WEB_PORT.

services:
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: unilim-timetable/api/Dockerfile
    restart: unless-stopped
    environment:
      CACHE_URL: redis://valkey:6379
    depends_on:
      valkey:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        APP_COMMIT_SHA: ${APP_COMMIT_SHA:-docker}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  valkey-data:
